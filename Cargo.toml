[package]
name = "pg_graphrag"
version = "0.1.0"
edition = "2021"
description = "GraphRAG engine inside PostgreSQL 18: provenance-first knowledge graphs, permission-aware retrieval, temporal facts, and in-database graph algorithms (PPR, Leiden, PathRAG)"
readme = "README.md"
rust-version = "1.96"

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg18"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []

[dependencies]
pgrx = "=0.19.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[dev-dependencies]
pgrx-tests = "=0.19.3"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
